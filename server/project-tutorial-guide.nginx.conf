# Include this file inside the existing HTTPS server block for zhuyz.art.
# It owns only this project's explicit API and admin prefixes.

location = /project-tutorial-guide-admin {
    return 302 /project-tutorial-guide-admin/;
}

location ^~ /project-tutorial-guide-admin/ {
    proxy_pass http://127.0.0.1:4902/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location = /project-tutorial-guide-api {
    return 301 /project-tutorial-guide-api/;
}

location ^~ /project-tutorial-guide-api/ {
    proxy_pass http://127.0.0.1:4902/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
