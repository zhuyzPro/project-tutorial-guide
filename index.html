<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Zhuyz Pro-猪油仔项目教程导航，按生活场景整理项目介绍和使用教程。" />
    <meta name="theme-color" content="#f5f8fc" />
    <title>Zhuyz Pro-猪油仔 · 项目教程导航</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // The published GitHub Pages site reads live data from the separately
      // deployed API. Local Node development continues to use its own /api.
      const guidePagesHosts = new Set(["zhuyz.cloud", "zhuyzpro.github.io"]);
      window.NAVIGUIDE_API_BASE = window.NAVIGUIDE_API_BASE || (guidePagesHosts.has(window.location.hostname)
        ? "https://zhuyz.art/project-tutorial-guide-api"
        : "/api");
      (() => { try { if (localStorage.getItem("naviguide-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {} })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="lucide-mini.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-cluster">
          <span class="site-status" role="status"><span class="status-dot" aria-hidden="true"></span>持续更新</span>
          <a class="brand" href="./" aria-label="Zhuyz Pro-猪油仔首页">
            <span class="brand-text"><strong>Zhuyz Pro-猪油仔</strong><small>PROJECT TUTORIALS</small></span>
          </a>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">PROJECT TUTORIALS</p>
          <h1 id="page-title"><span class="headline-gradient">项目教程，<br /><em>分步抵达。</em></span></h1>
          <p class="intro-copy">把项目入口、准备条件和正文教程整理在一起，按生活场景找到适合你的项目。</p>
        </section>

        <section id="projects" class="directory" aria-labelledby="directory-title">
          <div class="directory-toolbar">
            <div>
              <p class="eyebrow directory-kicker">PROJECT INDEX</p>
              <h2 id="directory-title" class="directory-title">按场景找到项目</h2>
            </div>
            <div class="toolbar-tools">
              <label class="search-box"><i data-lucide="search" aria-hidden="true"></i><span class="sr-only">搜索项目</span><input id="search-input" type="search" placeholder="搜索项目、关键词" autocomplete="off" /></label>
              <button id="clear-filter" class="text-button" type="button" hidden>清除筛选</button>
            </div>
          </div>
          <div class="directory-summary"><span>按分类浏览项目教程</span><span id="category-total-label">--</span></div>
          <nav id="category-list" class="section-nav" aria-label="项目分类筛选"></nav>
          <div id="project-grid" class="sections" aria-live="polite"><p class="load-state" role="status">正在整理项目索引…</p></div>
        </section>
      </main>

      <footer class="site-footer"><span>Zhuyz Pro-猪油仔 / PROJECT TUTORIALS</span><span>内容仅作经验整理，项目规则以官方页面为准</span><span id="footer-year">2026</span></footer>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button" title="切换深色模式" aria-label="切换深色模式"><i data-lucide="moon" aria-hidden="true"></i></button>

    <dialog id="project-dialog" class="project-dialog" aria-labelledby="dialog-title"><div class="dialog-frame"><button id="close-dialog" class="dialog-close" type="button" title="关闭教程" aria-label="关闭教程"><i data-lucide="x" aria-hidden="true"></i></button><div id="dialog-content"></div></div></dialog>
  </body>
</html>
